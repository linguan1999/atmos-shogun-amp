plugins {
    id 'com.android.application'
}

android {
    namespace 'com.shogun.amp'
    compileSdk 35

    defaultConfig {
        applicationId "com.shogun.amp"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    // 零三方依赖：纯框架 API + java.net.Socket
}
